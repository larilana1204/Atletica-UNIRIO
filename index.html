<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A³pa · Ingressos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2FA; --card:#FFFFFF; --ink:#0A1B3A; --mute:#566684; --line:#D3DCEC;
  --head:#0B3C8C; --head-ink:#FFFFFF;
  --btn:#0B3C8C; --btn-ink:#FFFFFF; --pop:#FF7A1A; --pop-ink:#1F0E00;
  --ok:#1B8A4B; --bad:#C62F2F; --warn:#3C4D6E;
  --okbg:#DDF3E5; --badbg:#FADDDA; --warnbg:#FFE6D1;
  --okfg:#0E5A2E; --badfg:#8E1B1B; --warnfg:#9A4300;
  --fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --fb:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071226; --card:#0F2142; --ink:#EAF0FC; --mute:#9DB0D3; --line:#1E3562;
    --head:#0A2E6E; --btn:#FF8A3D; --btn-ink:#1F0E00;
    --okbg:#10301F; --badbg:#3A1717; --warnbg:#43260F; --okfg:#6FE3A1; --badfg:#FF9B94; --warnfg:#FFB070;
  }
}
:root[data-theme="dark"]{
  --bg:#071226; --card:#0F2142; --ink:#EAF0FC; --mute:#9DB0D3; --line:#1E3562;
  --head:#0A2E6E; --btn:#FF8A3D; --btn-ink:#1F0E00;
  --okbg:#10301F; --badbg:#3A1717; --warnbg:#43260F; --okfg:#6FE3A1; --badfg:#FF9B94; --warnfg:#FFB070;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
[hidden]{display:none!important}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);display:flex;align-items:center;gap:12px;padding:12px 16px}
.top h1{margin:0;font-family:var(--fd);font-weight:900;font-size:26px;line-height:1;letter-spacing:.01em}
.top p{margin:2px 0 0;font-size:13px;opacity:.8}
.top .grow{flex:1;min-width:0}
.top h1,.top p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:40px;height:40px;flex:none;display:block}
.badge{width:40px;height:40px;flex:none;border-radius:50%;background:var(--pop);color:var(--pop-ink);display:grid;place-items:center;font-family:var(--fd);font-weight:900;font-size:24px;
  -webkit-mask:none;mask:none;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 6px,#000 6.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 6px,#000 6.5px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 50%,transparent 6px,#000 6.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 6px,#000 6.5px) right/51% 100% no-repeat}
.badge{-webkit-mask:none!important;mask:none!important}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:999px;padding:6px 12px;font-size:13px}

main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h2.sec{font-family:var(--fd);font-weight:800;font-size:30px;margin:4px 0 12px;line-height:1}

/* estatísticas */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--fd);font-weight:900;font-size:38px;line-height:1}
.stat span{font-size:13px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}

/* busca e filtros */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* lista */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row .who{flex:1;min-width:0}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mute);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.pend{background:var(--warnbg);color:var(--warnfg)}
.pill.used{background:var(--okbg);color:var(--okfg)}
.empty{text-align:center;color:var(--mute);padding:36px 12px;border:1px dashed var(--line);border-radius:12px}

/* formulário */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.field{margin-bottom:14px}
.in{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;background:var(--btn);color:var(--btn-ink);font-weight:700;width:100%}
.btn.pop{background:var(--pop);color:var(--pop-ink)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:10px 14px;width:auto}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}

/* navegação inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute);border-radius:10px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="true"]{color:var(--ink);background:color-mix(in srgb,var(--pop) 35%,transparent)}

/* portaria */
.cam{position:relative;aspect-ratio:1/1;background:#000;border-radius:16px;overflow:hidden;margin-bottom:12px}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#cfd8d2;padding:24px;gap:12px}
.cam .frame{position:absolute;inset:18%;border:3px solid var(--pop);border-radius:18px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.result{border-radius:16px;padding:20px;color:#fff;text-align:center;margin-bottom:12px}
.result.idle{background:var(--card);color:var(--mute);border:1px dashed var(--line);padding:18px}
.result.ok{background:var(--ok)}
.result.used{background:var(--bad)}
.result.invalid,.result.busy,.result.error,.result.wrongevent{background:var(--warn)}
.result .big{font-family:var(--fd);font-weight:900;font-size:44px;line-height:1;margin:0 0 6px}
.result .nm{font-size:22px;font-weight:700;margin:0}
.result .sub{margin:4px 0 0;opacity:.92}
.manual{display:flex;gap:8px;margin-bottom:18px}
.manual .in{text-transform:uppercase}
.log{display:flex;flex-direction:column;gap:6px}
.log div{display:flex;gap:10px;align-items:center;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.log .t{color:var(--mute);font-variant-numeric:tabular-nums}
.log .s{margin-left:auto;font-weight:700}
.s.ok{color:var(--okfg)}.s.used{color:var(--badfg)}.s.invalid,.s.busy,.s.error,.s.wrongevent{color:var(--warnfg)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,9,.7);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .x{float:right;background:none;border:0;font-size:26px;line-height:1;color:var(--mute);padding:0 4px}
.tkwrap{filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));margin:6px auto 14px;max-width:320px}
.tk-top,.tk-bot{position:relative;background:#fff;color:#0A1B3A}
.tk-top{background:#0B3C8C;color:#fff;border-radius:16px 16px 0 0;padding:18px 20px 22px;
  -webkit-mask:radial-gradient(circle at 0 100%,transparent 12px,#000 12.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 100%,transparent 12px,#000 12.5px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 100%,transparent 12px,#000 12.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 100%,transparent 12px,#000 12.5px) right/51% 100% no-repeat}
.tk-bot{border-radius:0 0 16px 16px;padding:22px 20px 18px;text-align:center;
  -webkit-mask:radial-gradient(circle at 0 0,transparent 12px,#000 12.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 0,transparent 12px,#000 12.5px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 0,transparent 12px,#000 12.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 0,transparent 12px,#000 12.5px) right/51% 100% no-repeat}
.tk-bot::before{content:"";position:absolute;left:18px;right:18px;top:0;border-top:2px dashed #b9c4bd}
.tk-ev{margin:0;font-size:13px;opacity:.8;font-weight:600}
.tk-top h2{margin:6px 0 4px;font-family:var(--fd);font-weight:900;font-size:36px;line-height:1;word-break:break-word}
.tk-kind{margin:0;color:#FF9A3D;font-weight:700}
.tk-bot canvas{width:220px;height:220px;image-rendering:pixelated;display:block;margin:0 auto 8px}
.tk-bot code{color:#0A1B3A;font-size:15px;letter-spacing:.06em;font-weight:700}
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid #C62F2F;color:#C62F2F;background:rgba(255,255,255,.88);padding:8px 16px;border-radius:10px;font-family:var(--fd);font-weight:900;font-size:34px;line-height:1;text-align:center}
.stamp small{display:block;font-family:var(--fb);font-size:13px;font-weight:700;margin-top:2px}
.acts{display:grid;gap:8px}
.png{width:100%;border-radius:12px;display:block;margin-bottom:10px}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:60;font-size:14px;font-weight:600;max-width:90%}

/* telas de acesso */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate .box{max-width:380px;width:100%}
.gate h1.org{font-size:38px;line-height:1.02}
.gate h1{font-family:var(--fd);font-weight:900;font-size:56px;line-height:.95;margin:14px 0 8px}
.gate p{color:var(--mute);margin:0 0 18px}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:8px 0 0}
.demo-tag{display:inline-block;background:var(--pop);color:var(--pop-ink);font-weight:700;font-size:12px;border-radius:99px;padding:3px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.banner{background:var(--warnbg);color:var(--warnfg);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}
.banner button{background:var(--warnfg);color:var(--warnbg);border:0;border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.money{margin:-6px 0 14px;font-size:14px;color:var(--mute)}
.money b{color:var(--ink)}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar .search{margin:0;flex:1}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px;display:grid;gap:4px}
.info span{color:var(--mute)}
.adm{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.adm .who{flex:1;min-width:0}
.adm b{display:block;overflow:hidden;text-overflow:ellipsis}
.adm small{color:var(--mute)}
.adm .btn{padding:8px 10px;font-size:13px}
.me{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mini{font-size:12px;font-weight:700;background:var(--pop);color:var(--pop-ink);border-radius:99px;padding:2px 8px}
.evsel{background:none;border:0;color:inherit;text-align:left;padding:0}
.adm .selb{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0}
.adm.cur{border-color:var(--btn);box-shadow:inset 0 0 0 2px var(--btn)}
.pill.def{background:var(--warnbg);color:var(--warnfg)}
</style>
</head>

function parseMoney(s){ s=String(s==null?'':s).trim().replace(/[^\d.,]/g,''); if(!s) return 0; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:Math.round(n*100)/100; }

async function sha(s){

  return sha256js(s);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

/* ---------- estado ---------- */
const state={api:null,mode:'',downloads:null,tickets:[],users:[],usersSeen:new Set(),local:{},events:[],eventId:null,migrated:false,evOk:false,tkOk:false,filter:'todos',q:'',tab:'lista',log:[],current:null,session:null};

/* ---------- armazenamento: modo demo (local) ---------- */
function makeDemo(){
  const KEY='atletica-demo-v3';
  let mem={tickets:{},users:{},events:{},evento:null};
  try{ const r=localStorage.getItem(KEY); if(r) mem=Object.assign(mem,JSON.parse(r)||{}); }catch(e){}
  const subs={t:new Set(),e:new Set(),u:new Set()};
  const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){} };
  const lt=()=>Object.keys(mem.tickets).map(code=>Object.assign({code},mem.tickets[code]));
  const lu=()=>Object.keys(mem.users).map(username=>Object.assign({username},mem.users[username]));
  const le=()=>Object.keys(mem.events).map(id=>Object.assign({id},mem.events[id]));
  const emit=()=>{ subs.t.forEach(f=>f(lt())); subs.e.forEach(f=>f(le())); subs.u.forEach(f=>f(lu())); };
  return {
    onTickets(cb){ subs.t.add(cb); cb(lt()); return ()=>subs.t.delete(cb); },
    onEvents(cb){ subs.e.add(cb); cb(le()); return ()=>subs.e.delete(cb); },
    onUsers(cb){ subs.u.add(cb); cb(lu()); return ()=>subs.u.delete(cb); },
    async getLegacy(){ return mem.evento||null; },
    async createEvent(id,d){ mem.events[id]=d; save(); emit(); },
    async updateEvent(id,p){ if(!mem.events[id]) throw new Error('nf'); Object.assign(mem.events[id],p); save(); emit(); },
    async removeEvent(id){ delete mem.events[id]; save(); emit(); },
    async createTicket(code,d){ mem.tickets[code]=d; save(); emit(); },
    async updateTicket(code,p){ if(!mem.tickets[code]) throw new Error('nf'); Object.assign(mem.tickets[code],p); save(); emit(); },
    async removeTicket(code){ delete mem.tickets[code]; save(); emit(); },
    async getUser(u){ return mem.users[u]||null; },
    async putUser(u,d){ mem.users[u]=d; save(); emit(); },
    async delUser(u){ delete mem.users[u]; save(); emit(); },
    async validate(code,by,eventId){
      const d=mem.tickets[code];
      if(!d) return {status:'invalid'};
      if((d.eventId||LEGACY_ID)!==eventId) return {status:'wrongevent',ticket:Object.assign({code},d)};
      if(d.usedAt) return {status:'used',ticket:Object.assign({code},d)};
      d.usedAt=new Date().toISOString(); d.usedBy=by; save(); emit();
      return {status:'ok',ticket:Object.assign({code},d)};
    }
  };
}

/* ---------- armazenamento: nuvem (db do artifact) ---------- */
function makeCloud(db){
  const holder='gate-'+newCode();
  return {
    onTickets(cb){ return db.collection('tickets').onSnapshot(s=>cb(s.docs.filter(d=>d.exists&&d.data()&&d.data().name).map(d=>Object.assign({code:d.id},d.data())),s.metadata&&s.metadata.fromCache),e=>console.error(e)); },
    onEvents(cb){ return db.collection('events').onSnapshot(s=>cb(s.docs.filter(d=>d.exists&&d.data()&&d.data().name).map(d=>Object.assign({id:d.id},d.data())),s.metadata&&s.metadata.fromCache),e=>console.error(e)); },
    onUsers(cb){ return db.collection('users').onSnapshot(s=>cb(s.docs.filter(d=>d.exists&&d.data()&&d.data().hash).map(d=>Object.assign({username:d.id},d.data()))),e=>console.error(e)); },
    async getLegacy(){ const s=await db.doc('config/evento').get(); return s.exists?s.data():null; },
    async createEvent(id,d){ await db.doc('events/'+id).set(d); },
    async updateEvent(id,p){ await db.doc('events/'+id).update(p); },
    async removeEvent(id){ await db.doc('events/'+id).delete(); },
    async createTicket(code,d){ await db.doc('tickets/'+code).set(d); },
    async updateTicket(code,p){ await db.doc('tickets/'+code).update(p); },
    async removeTicket(code){ await db.doc('tickets/'+code).delete(); },
    async getUser(u){ const s=await db.doc('users/'+u).get(); return s.exists?s.data():null; },
    async putUser(u,d){ await db.doc('users/'+u).set(d); },
    async delUser(u){ await db.doc('users/'+u).delete(); },
    async validate(code,by,eventId){
      const ref=db.doc('tickets/'+code);
      const why=e=>(e&&(e.code||e.message))||'erro';
      const classify=d=>{
        if(!d||!d.name) return {status:'invalid'};
        if((d.eventId||LEGACY_ID)!==eventId) return {status:'wrongevent',ticket:Object.assign({code},d)};
        if(d.usedAt) return {status:'used',ticket:Object.assign({code},d)};
        return null;
      };
      let d;
      try{ const sn=await ref.get(); d=sn.exists?sn.data():null; }
      catch(e){ return {status:'error',msg:'Falha ao consultar o ingresso ('+why(e)+').'}; }
      const early=classify(d); if(early) return early;
      for(let i=0;i<4;i++){
        let acq;
        try{ acq=await ref.acquire({holder,ttlMs:1500}); }catch(e){ acq={acquired:true}; }
        if(acq&&acq.acquired) break;
        if(i===3) return {status:'busy'};
        await sleep(350);
      }
      try{
        const sn=await ref.get(); const d2=sn.exists?sn.data():null;
        const again=classify(d2); if(again) return again;
        const usedAt=new Date().toISOString();
        await ref.update({usedAt,usedBy:by});
        return {status:'ok',ticket:Object.assign({code},d2,{usedAt,usedBy:by})};
      }catch(e){ return {status:'error',msg:'Falha ao validar ('+why(e)+'). Tente de novo.'}; }
    }
  };
}

/* ---------- armazenamento: Firebase (GitHub Pages / uso real) ---------- */
function makeFirebase(cfg){
  firebase.initializeApp(cfg);
  const auth=firebase.auth(), fs=firebase.firestore();
  const emailOf=(u,v)=>u+'+'+v+'@atletica.app';
  const SUPER_EMAIL=emailOf(SUPER_USER,0);
  const fpw=p=>p+'#a3pa';
  const code=e=>(e&&(e.code||e.message))||'erro';
  const denied=e=>{ console.error(e); if(e&&e.code==='permission-denied'&&state.session){ toast('Seu acesso foi removido ou expirou'); setTimeout(logout,1400); } };
  async function dirV(u){ if(u===SUPER_USER) return 0; const sn=await fs.doc('directory/'+u).get(); return sn.exists?sn.data().v:null; }
  async function sessionFor(user){
    const sn=await fs.doc('admins/'+user.email).get(); if(!sn.exists) return null;
    const d=sn.data();
    return {user:d.username,isSuper:user.email===SUPER_EMAIL,mustChange:!!d.mustChange,name:d.displayName||d.username};
  }
  async function createAccount(u,name,startV){
    const app2=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(cfg,'sec');
    const a2=app2.auth();
    for(let v=startV;v<startV+10;v++){
      const email=emailOf(u,v);
      try{
        await a2.createUserWithEmailAndPassword(email,fpw(DEFAULT_PW)); await a2.signOut();
        await fs.doc('admins/'+email).set({username:u,displayName:name||'',mustChange:true,createdAt:new Date().toISOString()});
        await fs.doc('directory/'+u).set({v});
        return {};
      }catch(e){ if(e&&e.code==='auth/email-already-in-use') continue; return {error:'Não foi possível criar ('+code(e)+')'}; }
    }
    return {error:'Não foi possível criar esse usuário'};
  }
  return {
    async login(u,p){
      if(!/^[a-z0-9._-]{3,24}$/.test(u)) return null;
      const v=await dirV(u); if(v==null) return null;
      const email=emailOf(u,v);
      try{ await auth.signInWithEmailAndPassword(email,fpw(p)); }
      catch(e){
        if(u===SUPER_USER&&(await sha('a3pa-root:'+p))===SUPER_HASH){
          try{ await auth.createUserWithEmailAndPassword(email,fpw(p)); }catch(e2){ return null; }
        }else return null;
      }
      let ses=null;
      try{ ses=await sessionFor(auth.currentUser); }catch(e){}
      if(!ses&&u===SUPER_USER){
        await fs.doc('admins/'+email).set({username:u,displayName:'Super admin',mustChange:false,createdAt:new Date().toISOString()});
        ses=await sessionFor(auth.currentUser);
      }
      if(!ses){ await auth.signOut(); return null; }
      return ses;
    },
    async restore(){
      const user=await new Promise(res=>{ const off=auth.onAuthStateChanged(x=>{ off(); res(x); }); });
      if(!user) return null;
      try{ const ses=await sessionFor(user); if(!ses){ await auth.signOut(); return null; } return ses; }catch(e){ return null; }
    },
    async logout(){ await auth.signOut(); },
    async changePassword(p0,p1){
      const user=auth.currentUser; if(!user) return {error:'Sessão expirada. Entre de novo.'};
      try{ await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,fpw(p0))); }
      catch(e){ return {error:'Senha atual incorreta.'}; }
      try{ await user.updatePassword(fpw(p1)); await fs.doc('admins/'+user.email).update({mustChange:false}); return {}; }
      catch(e){ return {error:'Não foi possível alterar agora ('+code(e)+').'}; }
    },
    async addAdmin(u,name){
      if(u===SUPER_USER) return {error:'Esse usuário é reservado'};
      try{
        const ds=await fs.doc('directory/'+u).get(); if(ds.exists) return {error:'Esse usuário já existe'};
        return await createAccount(u,name,1);
      }catch(e){ return {error:'Não foi possível criar ('+code(e)+')'}; }
    },
    async resetAdmin(u){
      try{
        const ds=await fs.doc('directory/'+u).get(); if(!ds.exists) return {error:'Usuário não encontrado'};
        const v=ds.data().v, old=emailOf(u,v);
        const adm=await fs.doc('admins/'+old).get();
        const r=await createAccount(u,adm.exists?adm.data().displayName:'',v+1);
        if(!r.error) await fs.doc('admins/'+old).delete();
        return r;
      }catch(e){ return {error:'Não foi possível redefinir ('+code(e)+')'}; }
    },
    async deleteAdmin(u){
      try{
        const ds=await fs.doc('directory/'+u).get();
        if(ds.exists){ await fs.doc('admins/'+emailOf(u,ds.data().v)).delete(); await fs.doc('directory/'+u).delete(); }
        return {};
      }catch(e){ return {error:'Não foi possível excluir ('+code(e)+')'}; }
    },
    onTickets(cb){ return fs.collection('tickets').onSnapshot(sn=>cb(sn.docs.map(d=>Object.assign({code:d.id},d.data())).filter(t=>t.name),sn.metadata.fromCache),denied); },
    onEvents(cb){ return fs.collection('events').onSnapshot(sn=>cb(sn.docs.map(d=>Object.assign({id:d.id},d.data())).filter(e=>e.name),sn.metadata.fromCache),denied); },
    onUsers(cb){ return fs.collection('admins').onSnapshot(sn=>cb(sn.docs.map(d=>d.data()).filter(d=>d.username&&d.username!==SUPER_USER)),denied); },
    async getLegacy(){ return null; },
    async createEvent(id,d){ await fs.doc('events/'+id).set(d); },
    async updateEvent(id,p){ await fs.doc('events/'+id).update(p); },
    async removeEvent(id){ await fs.doc('events/'+id).delete(); },
    async createTicket(c,d){ await fs.doc('tickets/'+c).set(d); },
    async updateTicket(c,p){ await fs.doc('tickets/'+c).update(p); },
    async removeTicket(c){ await fs.doc('tickets/'+c).delete(); },
    async validate(c,by,eventId){
      const ref=fs.doc('tickets/'+c);
      try{
        return await fs.runTransaction(async tx=>{
          const sn=await tx.get(ref); const d=sn.exists?sn.data():null;
          if(!d||!d.name) return {status:'invalid'};
          if((d.eventId||LEGACY_ID)!==eventId) return {status:'wrongevent',ticket:Object.assign({code:c},d)};
          if(d.usedAt) return {status:'used',ticket:Object.assign({code:c},d)};
          const usedAt=new Date().toISOString();
          tx.update(ref,{usedAt,usedBy:by});
          return {status:'ok',ticket:Object.assign({code:c},d,{usedAt,usedBy:by})};
        });
      }catch(e){ return {status:'error',msg:'Falha ao validar ('+code(e)+'). Tente de novo.'}; }
    }
  };
}

/* ---------- QR, PDF, Excel ---------- */
function drawQR(cv,text,px){
  if(typeof qrcode==='undefined'){ cv.width=cv.height=px; const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,px,px); c.fillStyle='#000'; c.fillText('QR indisponível',10,20); return; }
  const q=qrcode(0,'M'); q.addData(text); q.make();
  const n=q.getModuleCount(), quiet=2, tot=n+quiet*2, s=Math.max(2,Math.floor(px/tot));
  cv.width=cv.height=tot*s;
  const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height); c.fillStyle='#000';
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) c.fillRect((k+quiet)*s,(r+quiet)*s,s,s);
}
function ticketCanvas(t){
  const W=900,H=1280, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#0B3C8C'; c.fillRect(0,0,W,H);
  c.fillStyle='#FF7A1A'; c.fillRect(0,0,W,16);
  (function(){ const k=2.1, ox=W/2-24*k, oy=34;
    const poly=(pts,col)=>{ c.fillStyle=col; c.beginPath(); pts.forEach((p,i)=>{ const x=ox+p[0]*k,y=oy+p[1]*k; i?c.lineTo(x,y):c.moveTo(x,y); }); c.closePath(); c.fill(); };
    poly([[7,36],[41,36],[41,43],[7,43]],'#E85F00'); poly([[24,4],[33.5,37],[14.5,37]],'#FF7A1A');
    poly([[21.4,14],[26.6,14],[28.1,19],[19.9,19]],'#fff'); poly([[18.2,26],[29.8,26],[31.3,31],[16.7,31]],'#fff');
    c.fillStyle='#FF7A1A'; c.beginPath(); c.arc(ox+24*k,oy+5.4*k,2.4*k,0,7); c.fill(); })();
  c.fillStyle='#fff'; c.font='600 34px "Hanken Grotesk",Arial,sans-serif'; c.textAlign='center';
  const ev=evById(evOf(t)); c.fillText(ev.name+(ev.date?'  ·  '+ev.date:''),W/2,170,780);
  let fs=110; const ff=s=>'900 '+s+'px "Big Shoulders Display","Arial Narrow",Impact,sans-serif';
  c.font=ff(fs); while(c.measureText(t.name).width>780&&fs>40){ fs-=4; c.font=ff(fs); }
  c.fillText(t.name,W/2,290);
  c.fillStyle='#FF9A3D'; c.font='700 40px "Hanken Grotesk",Arial,sans-serif'; c.fillText(t.kind||'Ingresso',W/2,350);
  c.fillStyle='#fff'; c.beginPath(); if(c.roundRect) c.roundRect(100,400,700,800,32); else c.rect(100,400,700,800); c.fill();
  const q=document.createElement('canvas'); drawQR(q,t.code,560);
  c.imageSmoothingEnabled=false; c.drawImage(q,170,450,560,560);
  c.fillStyle='#0A1B3A'; c.font='700 44px "Hanken Grotesk",Arial,sans-serif'; c.fillText(t.code,W/2,1090);
  c.fillStyle='#566684'; c.font='500 28px "Hanken Grotesk",Arial,sans-serif'; c.fillText('Uso único · apresente na portaria',W/2,1150);
  return cv;
}
function ticketPDF(t){
  const J=window.jspdf&&window.jspdf.jsPDF; if(!J) throw new Error('nopdf');
  const pdf=new J({unit:'mm',format:'a4',orientation:'portrait'});
  const w=130,h=w*1280/900, x=(210-w)/2, y=18;
  pdf.setFillColor(237,242,250); pdf.rect(0,0,210,297,'F');
  pdf.addImage(ticketCanvas(t).toDataURL('image/png'),'PNG',x,y,w,h);
  pdf.setTextColor(60,70,64); pdf.setFontSize(11);
  pdf.text('Ingresso individual e intransferível. O QR code só pode ser validado uma vez.',105,y+h+12,{align:'center'});
  return pdf.output('blob');
}
async function saveFile(name,blob){
  if(state.downloads){
    try{ await state.downloads.save({filename:name,data:blob}); return true; }
    catch(e){ if(e&&e.code==='declined') return false; }
  }
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); return true;
  }catch(e){ toast('Não foi possível salvar o arquivo'); return false; }
}
const slug=s=>String(s||'ingresso').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'ingresso';

function exportExcel(all){
  const X=window.XLSX; if(!X){ toast('Biblioteca de Excel indisponível'); return; }
  if(!all&&!state.eventId){ toast('Crie um evento primeiro'); return; }
  const evs=all?state.events.slice().sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))):[curEvent()];
  const rows=state.tickets.filter(t=>all||evOf(t)===state.eventId).sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
  const head=['Evento','Código','Nome','E-mail','Telefone','Tipo de entrada','Valor pago (R$)','Status','Entrada em','Validado por','Emitido em','Emitido por'];
  const data=rows.map(t=>[evById(evOf(t)).name,t.code,t.name,t.email||'',t.phone||'',t.kind||'',Number(t.paid||0),t.usedAt?'Entrou':'Pendente',t.usedAt?fmt(t.usedAt):'',t.usedBy||'',t.createdAt?fmt(t.createdAt):'',t.createdBy||'']);
  const ws=X.utils.aoa_to_sheet([head].concat(data));
  ws['!cols']=[{wch:26},{wch:18},{wch:30},{wch:28},{wch:16},{wch:16},{wch:14},{wch:10},{wch:16},{wch:14},{wch:16},{wch:14}];
  data.forEach((_,i)=>{ const c=ws[X.utils.encode_cell({r:i+1,c:6})]; if(c) c.z='"R$" #,##0.00'; });
  const res=[['Evento','Tipo de entrada','Emitidos','Entraram','Arrecadado (R$)']];
  evs.forEach(ev=>{
    const er=rows.filter(t=>evOf(t)===ev.id);
    const kinds=KINDS.concat(Array.from(new Set(er.map(t=>t.kind).filter(k=>k&&!KINDS.includes(k)))));
    kinds.forEach(k=>{ const r=er.filter(t=>t.kind===k); if(all&&!r.length) return; res.push([ev.name,k,r.length,r.filter(t=>t.usedAt).length,r.reduce((a,t)=>a+Number(t.paid||0),0)]); });
  });
  res.push(['TOTAL','',rows.length,rows.filter(t=>t.usedAt).length,rows.reduce((a,t)=>a+Number(t.paid||0),0)]);
  const ws2=X.utils.aoa_to_sheet(res); ws2['!cols']=[{wch:26},{wch:18},{wch:10},{wch:10},{wch:16}];
  for(let i=1;i<res.length;i++){ const c=ws2[X.utils.encode_cell({r:i,c:4})]; if(c) c.z='"R$" #,##0.00'; }
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,'Ingressos'); X.utils.book_append_sheet(wb,ws2,'Resumo');
  const out=X.write(wb,{bookType:'xlsx',type:'array'});
  const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  saveFile(all?'ingressos-todos-os-eventos.xlsx':'ingressos-'+slug(curEvent().name)+'.xlsx',blob).then(ok=>{ if(ok) toast('Planilha pronta'); });
}

   '<div class="field"><label for="pw">Senha</label><input id="pw" class="in" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required></div><label style="display:flex;gap:8px;align-items:center;font-weight:500;margin:-6px 0 14px"><input type="checkbox" id="showpw"> Mostrar senha</label>'+

async function authenticate(u,p){
  if(u===SUPER_USER){ return (await sha('a3pa-root:'+p))===SUPER_HASH?{user:u,isSuper:true,mustChange:false,name:'Super admin'}:null; }
  if(!/^[a-z0-9._-]{3,24}$/.test(u)) return null;
  const d=await state.api.getUser(u); if(!d||!d.hash) return null;
  return (await sha(d.salt+':'+p))===d.hash?{user:u,isSuper:false,mustChange:!!d.mustChange,name:d.displayName||u}:null;

async function onAddAdmin(e){
  e.preventDefault();

async function onCreate(e){
  e.preventDefault();
  const f=readFields('n'); if(!f.name) return;
  if(!state.eventId){ toast('Crie um evento primeiro'); return; }
  const code=newCode();
  const data=Object.assign(f,{eventId:state.eventId,createdAt:new Date().toISOString(),createdBy:state.session.user,usedAt:null});
  const btn=e.submitter; if(btn) btn.disabled=true;
  try{ await state.api.createTicket(code,data); state.local[code]=data; e.target.reset(); showTicket(code); toast('Ingresso criado'); }
  catch(err){ toast('Não foi possível salvar. Verifique suas permissões.'); }
  if(btn) btn.disabled=false;
}
function findTicket(code){ const t=state.tickets.find(x=>x.code===code); if(t) return t; return state.local[code]?Object.assign({code},state.local[code]):null; }

async function downloadPDF(){
  const t=findTicket(state.current); if(!t) return;
  const b=await pdfFor(t); if(!b) return;
  if(await saveFile('ingresso-'+slug(t.name)+'.pdf',b)) toast('PDF gerado');
}
async function sharePDF(){
  const t=findTicket(state.current); if(!t) return;
  const b=await pdfFor(t); if(!b) return;
  const name='ingresso-'+slug(t.name)+'.pdf';
  try{
    const file=new File([b],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Ingresso · '+evById(evOf(t)).name}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  if(await saveFile(name,b)) toast('Compartilhamento indisponível aqui. PDF salvo.');
}

function ensureEvent(){
  if(state.events.find(e=>e.id===state.eventId)) return;
  let saved=null; try{ saved=localStorage.getItem('atl-event'); }catch(e){}
  const ok=state.events.find(e=>e.id===saved);
  const newest=state.events.slice().sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')))[0];
  state.eventId=ok?ok.id:(newest?newest.id:null);

  try{

    const d={name:(legacy&&legacy.name)||'Churrasco da Atlética',date:(legacy&&legacy.date)||'',createdAt:'2000-01-01T00:00:00.000Z',createdBy:state.session.user};

  try{
    const ts=state.tickets.filter(t=>evOf(t)===id);
    for(const t of ts){ await state.api.removeTicket(t.code); }
    await state.api.removeEvent(id);
    state.events=state.events.filter(e=>e.id!==id); state.tickets=state.tickets.filter(t=>evOf(t)!==id);
    ensureEvent(); renderHead(); renderList(); showEventos(); toast('Evento excluído');
  }catch(x){ toast('Não foi possível excluir'); }
}

/* ---------- portaria / leitura ---------- */
const scan={stream:null,active:false,last:'',until:0,cv:document.createElement('canvas'),inflight:new Set(),bd:null,busy:false};
try{ if('BarcodeDetector' in window) scan.bd=new BarcodeDetector({formats:['qr_code']}); }catch(e){ scan.bd=null; }
async function startCam(){
  if(scan.active) return;
  const v=$('#cam'); if(!v) return;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('nocam'),{name:'NoCam'});
    try{ scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); }
    catch(e1){ if(e1&&e1.name==='NotAllowedError') throw e1; scan.stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    v.srcObject=scan.stream; v.muted=true; v.setAttribute('playsinline','');
    await v.play();
    scan.active=true; $('#camOff').hidden=true; $('#frame').hidden=false; tick();
  }catch(e){
    const n=e&&e.name, msg=n==='NotAllowedError'?'A câmera está bloqueada. Toque no cadeado ao lado do endereço do site, permita a câmera e depois em "Tentar de novo".':
      n==='NotFoundError'?'Nenhuma câmera encontrada neste aparelho.':'A câmera ao vivo não abriu. Use "Tirar foto do QR" ou "Escolher imagem", ou digite o código abaixo.';
    stopCam(true);
    $('#camOff').innerHTML='<div><p style="margin:0 0 12px">'+esc(msg)+'</p><button class="btn pop sm" data-act="cam">Tentar de novo</button></div>';
    $('#camOff').hidden=false;
  }
}
function stopCam(keepMsg){
  scan.active=false;
  if(scan.stream){ scan.stream.getTracks().forEach(t=>t.stop()); scan.stream=null; }
  const v=$('#cam'); if(v) v.srcObject=null;
  const off=$('#camOff'); if(off&&!keepMsg){ off.hidden=false; off.innerHTML=camIdle(); }
  const f=$('#frame'); if(f) f.hidden=true;
}
function jsqrFrom(src,w,h,max,both){
  if(typeof jsQR==='undefined') return null;
  const sc=Math.min(1,max/Math.max(w,h)), cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
  scan.cv.width=cw; scan.cv.height=ch;
  const c=scan.cv.getContext('2d',{willReadFrequently:true}); c.drawImage(src,0,0,cw,ch);
  const r=jsQR(c.getImageData(0,0,cw,ch).data,cw,ch,{inversionAttempts:both?'attemptBoth':'dontInvert'});
  return r&&r.data?r.data:null;
}
async function tick(){
  if(!scan.active) return;
  const v=$('#cam');
  if(v&&v.readyState>=2&&v.videoWidth&&!scan.busy){
    scan.busy=true;
    try{
      let txt=null;
      if(scan.bd){ try{ const r=await scan.bd.detect(v); if(r&&r.length) txt=r[0].rawValue; }catch(e){} }
      if(!txt) txt=jsqrFrom(v,v.videoWidth,v.videoHeight,960,false);
      if(txt) handleScan(txt,false);
    }finally{ scan.busy=false; }
  }
  setTimeout(tick,100);
}
async function decodeImage(img){
  if(scan.bd){ try{ const r=await scan.bd.detect(img); if(r&&r.length) return r[0].rawValue; }catch(e){} }
  for(const m of [1600,1100,720,480]){ const t=jsqrFrom(img,img.naturalWidth||img.width,img.naturalHeight||img.height,m,true); if(t) return t; }
  return null;
}
function onPhoto(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=async()=>{
    const t=await decodeImage(img); URL.revokeObjectURL(url);
    if(t) handleScan(t,true); else toast('Não achei QR code na imagem. Use uma imagem nítida, com o QR inteiro visível.');
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('Não foi possível abrir a imagem'); };
  img.src=url;
}
let actx;
function beep(kind){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq=kind==='ok'?[[880,.12]]:[[220,.18],[180,.22]]; let t=actx.currentTime;
    seq.forEach(([f,d])=>{ const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; o.type='square'; g.gain.value=.08; o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t+=d+.05; });
  }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate(kind==='ok'?80:[120,60,120]); }catch(e){}
}
async function handleScan(raw,manual){
  const now=Date.now();
  if(!manual){ if(raw===scan.last&&now<scan.until) return; scan.last=raw; scan.until=now+4000; }
  const code=extractCode(raw); let res;
  if(!code){ res={status:'invalid',msg:'Não é um ingresso desta festa.'}; }
  else{
    if(scan.inflight.has(code)) return;
    scan.inflight.add(code);
    try{ res=await state.api.validate(code,state.session.user,state.eventId); } finally{ scan.inflight.delete(code); }
    if(res.status==='ok'&&!manual) scan.until=Date.now()+8000;
  }
  showResult(res,code);
}
function showResult(res,code){
  const t=res.ticket, el=$('#result');
  const map={
    ok:['ENTRADA LIBERADA',t&&t.name,(t&&t.kind||'')],
    used:['JÁ VALIDADO',t&&t.name,'Este QR code já foi usado em '+(t&&t.usedAt?fmt(t.usedAt):'—')],
    wrongevent:['OUTRO EVENTO',t&&t.name,'Este ingresso é de: '+evById(evOf(t||{})).name+'. Não vale para '+curEvent().name+'.'],
    invalid:['QR INVÁLIDO','',res.msg||'Código não encontrado na lista.'],
    busy:['AGUARDE','','Outro aparelho está validando este código. Leia de novo em instantes.'],
    error:['ERRO','',res.msg||'Tente novamente.']
  };
  const m=map[res.status]||map.error;
  el.className='result '+res.status;
  el.innerHTML='<p class="big">'+m[0]+'</p>'+(m[1]?'<p class="nm">'+esc(m[1])+'</p>':'')+'<p class="sub">'+esc(m[2])+'</p>';
  beep(res.status==='ok'?'ok':'bad');
  state.log.unshift({at:new Date().toISOString(),status:res.status,name:(t&&t.name)||code||'—'});
  state.log=state.log.slice(0,8);
  const lab={ok:'Liberado',used:'Já usado',invalid:'Inválido',wrongevent:'Outro evento',busy:'Aguarde',error:'Erro'};
  $('#log').innerHTML=state.log.map(l=>'<div><span class="t">'+esc(hm(l.at))+'</span><span>'+esc(l.name)+'</span><span class="s '+l.status+'">'+lab[l.status]+'</span></div>').join('');
}

/* ---------- cliques ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act],[data-tab],[data-code],[data-filter]'); if(!el) return;
  if(el.dataset.tab){ setTab(el.dataset.tab); return; }
  if(el.dataset.filter){ state.filter=el.dataset.filter; renderList(); return; }
  const act=el.dataset.act;
  if(!act&&el.dataset.code){ showTicket(el.dataset.code); return; }
  if(act==='close') closeModal();
  else if(act==='back') showTicket(state.current);
  else if(act==='cam') startCam();
  else if(act==='photo'){ const p=$('#photo'); if(p){ p.value=''; p.click(); } }
  else if(act==='gallery'){ const p=$('#gallery'); if(p){ p.value=''; p.click(); } }
  else if(act==='pdf') downloadPDF();
  else if(act==='share') sharePDF();
  else if(act==='edit') showEdit(state.current);
  else if(act==='export') exportExcel(false);
  else if(act==='conta') showConta();
  else if(act==='senha') showSenha();
  else if(act==='eventos') showEventos();
  else if(act==='newev') showEventForm(null);
  else if(act==='editev') showEventForm(el.dataset.ev);
  else if(act==='selev') selectEvent(el.dataset.ev);
  else if(act==='exportall') exportExcel(true);
  else if(act==='delev'){
    if(el.dataset.armed!=='1'){ el.dataset.armed='1'; el.textContent='Toque de novo: apaga TODOS os ingressos deste evento'; return; }
    deleteEvent(el.dataset.ev);
  }
  else if(act==='sair') logout();
  else if(act==='copy'){ try{ await navigator.clipboard.writeText(state.current); toast('Código copiado'); }catch(x){ toast(state.current); } }
  else if(act==='del'){
    if(!state.session.isSuper){ toast('Somente o administrador a3pa pode excluir ingressos'); return; }
    if(el.dataset.armed!=='1'){ el.dataset.armed='1'; el.textContent='Toque de novo para confirmar'; return; }
    try{ await state.api.removeTicket(state.current); delete state.local[state.current]; closeModal(); toast('Ingresso excluído'); }catch(x){ toast('Sem permissão para excluir'); }
  }
  else if(act==='resetadm'||act==='deladm'){
    if(!state.session.isSuper) return;
    const u=el.dataset.user;
    if(el.dataset.armed!=='1'){ el.dataset.armed='1'; el.textContent='Confirmar?'; setTimeout(()=>{ if(el.isConnected){ el.dataset.armed='0'; el.textContent=act==='deladm'?'Excluir':'Redefinir'; } },3500); return; }
    if(state.api.deleteAdmin){
      const r=act==='deladm'?await state.api.deleteAdmin(u):await state.api.resetAdmin(u);
      toast(r&&r.error?r.error:(act==='deladm'?'Acesso de '+u+' removido':'Senha de '+u+' voltou para '+DEFAULT_PW));
      return;
    }
    try{
      if(act==='deladm'){ await state.api.delUser(u); toast('Acesso de '+u+' removido'); }
      else{
        const d=await state.api.getUser(u); if(!d) return;
        const salt=rnd(10);
        await state.api.putUser(u,Object.assign({},d,{salt,hash:await sha(salt+':'+DEFAULT_PW),mustChange:true}));
        toast('Senha de '+u+' voltou para '+DEFAULT_PW);
      }
    }catch(x){ toast('Não foi possível concluir'); }
  }
});
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#modal').hidden) closeModal(); });

/* ---------- inicialização ---------- */
let started=false;
function startApp(){
  if(started) return; started=true;
  buildShell();
  state.api.onEvents((list,cache)=>{ state.events=list; if(!cache) state.evOk=true; ensureEvent(); renderHead(); renderList(); maybeMigrate(); });
  state.api.onTickets((list,cache)=>{ state.tickets=list; if(!cache) state.tkOk=true; renderList(); maybeMigrate(); });
  state.api.onUsers(list=>{
    state.users=list;
    const names=new Set(list.map(u=>u.username));
    if(!state.session.isSuper&&state.usersSeen.has(state.session.user)&&!names.has(state.session.user)){ toast('Seu acesso foi removido'); setTimeout(logout,1200); }
    names.forEach(n=>state.usersSeen.add(n));
    renderAdmin();
  });
}
(async function init(){
  showLoading();
  let db=null,user=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const r=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);
      db=r[0]; user=r[1]; state.downloads=r[2];
    }
  }catch(e){ db=null; }
  if(db){
    let w=null; try{ w=user?user.can('data.write'):null; }catch(e){}
    if(w===false){ showRestricted(); return; }
    state.mode='cloud'; state.api=makeCloud(db);
  }else if(FB_OK&&!window.firebase){
    gateScreen(logo+'<h1 class="org">Não foi possível carregar</h1><p>O serviço de dados (Firebase) não abriu. Confira a internet, desative bloqueadores de anúncio para este site e recarregue a página.</p><button class="btn" onclick="location.reload()">Recarregar</button>');
    return;
  }else if(FB_OK&&window.firebase){
    state.mode='firebase'; state.api=makeFirebase(FIREBASE_CONFIG);
    try{ state.session=await state.api.restore(); }catch(e){}
    if(state.session) startApp(); else showLogin();
    return;
  }else{ state.mode='demo'; state.api=makeDemo(); }
  let saved=null; try{ saved=sessionStorage.getItem('atl-session'); }catch(e){}
  if(saved){
    try{
      if(saved===SUPER_USER){ state.session={user:SUPER_USER,isSuper:true,mustChange:false,name:'Super admin'}; }
      else{ const d=await state.api.getUser(saved); if(d) state.session={user:saved,isSuper:false,mustChange:!!d.mustChange,name:d.displayName||saved}; }
    }catch(e){}
  }
  if(state.session) startApp(); else showLogin();
})();
})();
</script>
